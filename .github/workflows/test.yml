name: ci
on:
  push:
    branches:
      - '**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: Check out code
      - name: Setup dotnet
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '7.0'
      - name: Setup Docker Daemon
        uses: docker/setup-buildx-action@v3
      - name: Run Unit & Integration Tests
        run: dotnet test -c Release
